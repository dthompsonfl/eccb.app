name: Dependency Refresh

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'chatgpt/eccb-production-reconcile-20261001' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pin npm
        run: npm install --global npm@11.1.0

      - name: Update security-sensitive direct dependencies
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          Object.assign(pkg.dependencies, {
            'next': '16.3.8',
            'better-auth': '^1.7.7',
            '@prisma/adapter-mariadb': '^7.10.0',
            '@prisma/client': '^7.10.0',
            'prisma': '^7.10.0',
            'nodemailer': '^10.0.13'
          });
          Object.assign(pkg.devDependencies, {
            '@prisma/config': '^7.10.0',
            'prisma': '^7.10.0'
          });
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install
          npm audit fix || true

      - name: Record remaining audit result
        run: npm audit --audit-level=moderate || true

      - name: Remove one-shot workflow
        run: rm .github/workflows/dependency-refresh.yml

      - name: Commit regenerated manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/dependency-refresh.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(deps): remediate audited dependency vulnerabilities"
          git push origin HEAD:${{ github.head_ref }}
