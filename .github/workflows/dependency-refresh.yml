name: Dependency Refresh

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'chatgpt/eccb-production-reconcile-20261001' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pin npm
        run: npm install --global npm@11.1.0

      - name: Update remaining audited direct dependencies
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          Object.assign(pkg.dependencies, {
            'dompurify': '^3.4.16',
            'hono': '^4.13.10',
            'mysql2': '^3.24.5',
            'sharp': '^0.35.5',
            'socket.io': '^4.8.4',
            'socket.io-client': '^4.8.4'
          });
          Object.assign(pkg.devDependencies, {
            'nanoid': '^6.0.1',
            'vite': '^8.3.2',
            'vitest': '^4.1.11',
            '@vitest/coverage-v8': '^4.1.11',
            'concurrently': '^10.0.5'
          });
          pkg.overrides = {
            ...(pkg.overrides || {}),
            'mariadb': '3.5.4',
            'shell-quote': '1.11.0'
          };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install
          npm update
          npm audit fix || true

      - name: Record remaining audit result
        run: npm audit --audit-level=moderate || true

      - name: Remove one-shot workflow
        run: rm .github/workflows/dependency-refresh.yml

      - name: Commit regenerated manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/dependency-refresh.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(deps): complete audited dependency refresh"
          git push origin HEAD:${{ github.head_ref }}
